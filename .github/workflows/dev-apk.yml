name: Build development APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test server and MCP bridge
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install -r server/requirements.txt
          cd server
          .venv/bin/python -m unittest -v test_flow
      - name: Test authenticated remote MCP gateway
        run: |
          server/.venv/bin/pip install -r gateway/requirements.txt
          PYTHONPATH=gateway:server server/.venv/bin/python -m unittest discover -s gateway -p 'test_*.py' -v
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Restore stable development signing key
        env:
          MATHNOTE_KEYSTORE_B64: ${{ secrets.MATHNOTE_KEYSTORE_B64 }}
        run: |
          test -n "$MATHNOTE_KEYSTORE_B64"
          printf '%s' "$MATHNOTE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mathnote-dev.p12"
      - name: Build signed debug APK
        working-directory: android
        env:
          MATHNOTE_KEYSTORE_FILE: ${{ runner.temp }}/mathnote-dev.p12
          MATHNOTE_KEYSTORE_PASSWORD: ${{ secrets.MATHNOTE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify stable APK signer
        run: |
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = '0c89e81393f1d046b71aa784105ad13b7bf46e963ec4a73c2843c98615dd45ad'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test stylus input and note reopening on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Name APK for tablet download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MathNote-debug.apk
      - name: Upload APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: MathNote-debug
          path: MathNote-debug.apk
      - name: Create or update development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --target "$GITHUB_SHA" --title 'MathNote development APK' --prerelease --notes 'Test build. Install the APK on an Android tablet. Uninstall an older dev build if Android reports a signature mismatch.'
          fi
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev
          gh release upload dev MathNote-debug.apk --clobber
          gh release delete-asset dev app-debug.apk --yes || true
