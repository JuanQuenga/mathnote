name: Build development APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test server and MCP bridge
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install -r server/requirements.txt
          cd server
          .venv/bin/python -m unittest -v test_flow
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build signed debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: MathNote-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Create or update development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --target "$GITHUB_SHA" --title 'MathNote development APK' --prerelease --notes 'Test build. Install the APK on an Android tablet. Uninstall an older dev build if Android reports a signature mismatch.'
          fi
          gh release upload dev 'android/app/build/outputs/apk/debug/app-debug.apk#MathNote-debug.apk' --clobber
