plugins { id 'com.android.application' }

def stableKeyFile = System.getenv('MATHNOTE_KEYSTORE_FILE')
def stableKeyPassword = System.getenv('MATHNOTE_KEYSTORE_PASSWORD')

android {
    namespace 'com.mathnote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mathnote'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (stableKeyFile && stableKeyPassword) {
        signingConfigs {
            stableDebug {
                storeFile file(stableKeyFile)
                storePassword stableKeyPassword
                keyAlias 'mathnote-dev'
                keyPassword stableKeyPassword
                storeType 'PKCS12'
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.stableDebug }
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
